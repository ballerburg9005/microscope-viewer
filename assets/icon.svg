<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16222b"/>
      <stop offset="1" stop-color="#0a0e11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#1f8f63" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1f8f63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="150" y1="90" x2="380" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bfeeff"/>
      <stop offset="0.5" stop-color="#7fd6f5"/>
      <stop offset="1" stop-color="#34b985"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe9ff"/>
      <stop offset="1" stop-color="#2aa776"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#3a5260" stroke-opacity="0.5" stroke-width="3"/>

  <!-- microscope, slightly inclined -->
  <g transform="rotate(-16 256 256)" stroke-linecap="round" stroke-linejoin="round">
    <!-- base -->
    <path d="M150 388 q0 -20 22 -20 h128 q22 0 22 20 v6 q0 12 -16 12 h-140 q-16 0 -16 -12 z" fill="url(#metal)"/>
    <rect x="218" y="330" width="20" height="48" fill="url(#metal)"/>

    <!-- stage -->
    <rect x="150" y="300" width="148" height="20" rx="8" fill="url(#metal)"/>
    <rect x="196" y="288" width="56" height="14" rx="4" fill="#0a0e11" fill-opacity="0.55"/>

    <!-- arm -->
    <path d="M276 330 q34 0 34 -40 v-150 q0 -22 -22 -22 h-10" fill="none" stroke="url(#metal)" stroke-width="30"/>

    <!-- body tube -->
    <rect x="244" y="118" width="36" height="150" rx="18" fill="url(#metal)"/>
    <!-- objective -->
    <path d="M248 268 h28 l-7 30 h-14 z" fill="url(#metal)"/>
    <circle cx="262" cy="300" r="9" fill="url(#lens)"/>

    <!-- eyepiece -->
    <rect x="238" y="92" width="48" height="34" rx="14" fill="url(#metal)"/>
    <circle cx="262" cy="98" r="13" fill="url(#lens)"/>

    <!-- focus knob -->
    <circle cx="312" cy="250" r="20" fill="#0a0e11"/>
    <circle cx="312" cy="250" r="20" fill="none" stroke="url(#metal)" stroke-width="9"/>
  </g>
</svg>
